    "Build 089 direct replay attrition audit records read-only stage counts for Priority-1 direct replay candidates and comparator candidate, applies explicit regime vocabulary bridge diagnostics, emits JSON/Markdown/CSV reports, and carries no live trading, broker execution, capital allocation, position sizing, paper placement, candidate promotion, production promotion, or confidence-increase authority.",
