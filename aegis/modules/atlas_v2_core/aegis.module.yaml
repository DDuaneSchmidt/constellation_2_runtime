    "Build 096 Holdout Event Row Builder Design is research-only schema/import readiness work. It prepares future event-row materialization but does not execute holdout validation or grant confidence or trading authority.",
    "Build 098 Exact Coverage Import Validator validates Build 097 required intraday CSV imports plus exact-available symbol/timeframe rows from the reversal/trending coverage plan when absent from the static specification, writes readiness matrices and normalized cache files, and carries no exact replay, candidate validation, promotion, live trading, broker, capital, paper-placement, position-sizing, recommendation, production, or confidence-increase authority.",
    "Build 108 exact replay without fallback consumes Build 098/107-style exact CSV validation readiness, runs only exact symbol/timeframe replays for REVERSAL/TRENDING target families, emits blocked rows for missing or fallback-required data, and carries no live trading, broker execution, capital allocation, position sizing, paper placement, candidate promotion, production promotion, or default confidence increase authority.",
    "Build 107 exact data repair loop identifies policy-repairable exact CSV defects from Build 098 validator output, repairs only sortable/deduplicable timestamp issues without inventing rows or changing prices, emits repair/revalidation matrices, runs no replay, and has confidence impact NONE.",
    "Build 109 net-of-cost evidence applies conservative fixed bps transaction-cost/slippage scenarios of 0, 1, 2, 5, and 10 bps to exact replay and holdout evidence, includes share-cost scenarios only when source rows carry defensible share/notional inputs, reports gross vs net expectancy/profit factor and cost erosion, emits NET_SURVIVES_STRONG, NET_SURVIVES_WEAK, COST_ERODED, NET_FAILED, NET_INSUFFICIENT_SAMPLE, or NET_BLOCKED classifications, and grants no live trading, position sizing, recommendations, promotion, or confidence authority by itself.",
    "Build 118 cost robustness expansion consumes Build 109 net-of-cost evidence, stress-tests fixed bps scenarios of 0, 1, 2, 5, 10, 15, 20, and 25 bps, reports break-even cost, strongest family, cost-robust families, and cost-sensitive families, and grants no live trading, position sizing, recommendations, promotion, production, or confidence-increase authority.",
    "Build 110 final evidence synthesis summarizes direct replay, exact replay, holdout, forward readiness, lineage, stability, and net-of-cost evidence into research-only classifications with no trading authority, candidate promotion, production promotion, or trade recommendations.",
    "Build 119 evidence review board performs a formal research-only review across exact replay, net-of-cost, forward observation, holdout status, family stability, and lineage graph evidence, emits latest JSON/Markdown plus scorecard/family/unresolved CSVs, restricts final classifications to RESEARCH_PROMISING, RESEARCH_WEAK, RESEARCH_REJECTED, or RESEARCH_INCONCLUSIVE, and grants no confidence, trading, promotion, production, recommendation, capital, sizing, broker, or paper-placement authority.",
