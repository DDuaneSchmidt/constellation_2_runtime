    "Operator cockpit reads prebuilt operator_state_snapshot_v1, paper_operator_projection_v1, candidate_lifecycle_projection_v1, and signal_evidence_boundary_v1 on request; it must not synchronously rebuild heavy truth artifacts during /api/aegis/operator-cockpit GET handling.",
    "Operator cockpit exposes operator_cockpit_timing_ms for phase-level performance diagnostics; portal smoke allows a 30s per-endpoint timeout because comprehensive historical read models can exceed 40MB while remaining read-only and policy-safe.",
    "Positions action boundaries are strict: Today's Candidates never renders Record Exit; open paper position rows are the only primary Positions surface where Record Exit appears; closed positions and candidate rows expose view/receipt/history actions only.",
    "Today's Candidates output-candidate rows expose operator capture confirmation paths when readiness permits; rejected-intent lineage rows must not appear there and must not expose Confirm Captured, Mark Not Captured, or Defer.",
    "Candidate readiness gating applies only after signal evidence boundary: output candidates missing planned_entry, planned_stop, or quantity are INCOMPLETE_CANDIDATE; rejected-intent lineage is counted as excluded and displayed on diagnostics/history surfaces.",
    "AEGIS_OPERATOR_WORKFLOW.md is the business/operator workflow authority for Positions; AEGIS_POSITIONS_UI_REQUIREMENTS.md is the product requirements authority that implements it for future Positions UI and manual paper workflow changes.",
    "AEGIS_CANDIDATE_READINESS_REQUIREMENTS.md defines when captured candidates become operator-reviewable; raw or incomplete candidate output must not expose operator disposition actions.",
    "AEGIS_OPERATOR_STATUS_CLASSIFICATION_REQUIREMENTS.md defines operator-facing status language: bare FAILED, BLOCKED, PARTIAL, UNKNOWN, STALE, and MISSING are forbidden on main operator surfaces unless paired with classification, explanation, affected count/object, next action, and tests.",
    "The Positions candidate capture panel consumes /api/aegis/positions candidate_capture_status and must render classification, explanation, affected_count, next_action, and diagnostics_link; read-model mismatches where signal evidence has output rows but display candidates are empty are classified as STALE_READ_MODEL, not FAILED.",
    "AEGIS_CANDIDATE_CONSTRUCTION_REQUIREMENTS.md is the product authority for converting captured/raw candidates into constructed, operator-reviewable candidates; construction status and provider errors must remain separate from candidate capture.",
    "AEGIS_CONSTRUCTION_INPUT_BOUNDARY_REQUIREMENTS.md defines the canonical construction input boundary: every current-session candidate must be constructed, rejected, blocked, or marked not eligible; silent omission between lifecycle, contracts, market-data binding, construction, and readiness is forbidden.",
    "AEGIS_SIGNAL_EVIDENCE_BOUNDARY_REQUIREMENTS.md defines the signal evidence boundary: Today's Candidates shows only SIGNAL_EVIDENCE_PRESENT output-intent candidates, while rejected-intent lineage is explicitly excluded to diagnostics/history.",
    "AEGIS_CONTRACT_GENERATION_REQUIREMENTS.md defines the contract generation boundary: every current-session candidate must receive VALID_CONTRACT, CONTRACT_BLOCKED, CONTRACT_REJECTED, NOT_ELIGIBLE_FOR_CONTRACT, or CONTRACT_INPUT_BOUNDARY_BLOCKED; market-data-valid candidates missing from signal evidence must not be silently omitted.",
    "AEGIS_DUPLICATE_CANDIDATE_REQUIREMENTS.md defines duplicate-candidate behavior across same-session, same-day, cross-day, open-position, recent-capture, recent-rejection, recent-deferred, and recently-closed scopes; no candidate may be presented as a new actionable candidate until duplicate classification has been evaluated.",
    "AEGIS_SLEEVE_ANALYTICS_PRODUCT_REQUIREMENTS.md is the product authority for Sleeve Analytics operator decisions and user experience; new Sleeve Analytics features must support continue monitoring, investigate, validate, reduce confidence, retire, compare, or review allocation evidence decisions without recommending trades or allocation changes.",
    "AEGIS_SLEEVE_ANALYTICS_REQUIREMENTS.md defines Sleeve Analytics as a canonical read model, aegis_sleeve_analytics_v1; no Sleeve Analytics UI may compute analytics from multiple raw sources or launch before the canonical artifact and self-check commands exist.",
    "AEGIS_RESEARCH_REVIEW_REQUIREMENTS.md is the product authority for Research Review; recommendation-ready hypotheses require an operator-readable review brief or an explicit BLOCKED reason and must not enable trade advice, broker order submission, live execution, or autonomous trading.",
    "AEGIS_HYPOTHESIS_VALIDATION_WORKFLOW_REQUIREMENTS.md is the authority for autonomous Research Lab hypothesis validation: qualified hypotheses should progress to paper-testing sleeves, linked symbols, paper-validation candidates, and validation outcomes without operator approval unless an explicit safety blocker exists; live broker submit/transmit, trade advice, and autonomous live trading remain disabled.",
    "aegis_hypothesis_qualification_v1 emits hypothesis_qualification.v1.json and npm run aegis:hypothesis-qualification; aegis_paper_testing_sleeve_v1 emits paper_testing_sleeve.v1.json and npm run aegis:paper-testing-sleeves so qualified hypotheses automatically create PAPER_TESTING sleeves with explicit linked-symbol statuses while broker execution, live trading, autonomous live trading, and trade advice gates remain false.",
    "rh-process-test-etf-drop-mean-reversion-v1 uses the deterministic ETF drop mean-reversion execution layer in run_research_test_v1; npm run aegis:research-test-status reports whether research tests have DATA_NEEDED, INCONCLUSIVE_SAMPLE_SIZE, or completed results without broker execution, live trading, autonomous live trading, or trade advice.",
    "aegis_research_validation_samples_v1 emits research_validation_samples.v1.json and npm run aegis:research-validation-samples so ETF mean-reversion validation accumulates monotonic forward-return samples from governed trigger events plus the next market close, excludes non-trigger, pending, stale, or invalid observations with reasons, requests qualification rerun when the threshold is met, and does not create paper-testing sleeves before qualification.",
    "Research Lab and Research Review map MORE_RESEARCH_REQUIRED plus INSUFFICIENT_FORWARD_RETURN_SAMPLE to the operator-facing Collecting Evidence state: sample counts, missing samples, next market-close sample timing, estimated completion after valid observations, no operator action required, and no paper-testing sleeve yet are shown plainly without manual-review or recommendation-ready language for that hypothesis.",
