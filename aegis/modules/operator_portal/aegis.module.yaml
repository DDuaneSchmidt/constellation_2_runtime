    "aegis_sleeve_evaluation_v1 emits sleeve_evaluation.v1.json and npm run aegis:sleeve-evaluation so Sleeve Analytics can display deterministic silent-sleeve classifications, runtime failure counts, data-blocked missing input names, nearest-miss availability, explanations, and repair actions without changing sleeve logic, creating candidates, producing trade advice, or modifying trading gates.",
