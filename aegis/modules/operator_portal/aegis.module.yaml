    "Candidate-generation diagnostics include C2_INTENT_SIMULATOR_V1 as a diagnostic-only row when sleeve evaluation evidence exists, excluded from production candidate sleeve counts, so audits can distinguish filtered/skipped simulator state without changing sleeve logic, candidate generation, broker execution, trade advice, autonomous execution, or safety gates.",
    "Market-neutral spread runner bootstraps the repo root onto sys.path before importing shared canon/schema helpers so sleeve evaluation works from non-repo working directories; this is an execution-environment repair only and does not change thresholds, symbols, candidate logic, broker execution, trade advice, autonomous execution, or safety gates.",
