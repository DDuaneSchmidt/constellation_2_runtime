  "implementation_notes": [
    "Immutable AEGIS Lite deployments resolve source identity from the governed release manifest when Git metadata and the Git executable are intentionally absent from the runtime image; missing or invalid manifest identity remains fail-closed and no trading, broker, candidate, allocation, or safety-gate behavior changes.",
    "Oil Shock Risk Policy Schema Repair V1 adds a schema-conformance proof artifact and audit command for C2_OIL_SHOCK_REVERSAL_V1 without changing strategy behavior, stop-loss thresholds, paper construction, outcome behavior, marks, broker behavior, trade advice, live trading, autonomous execution, or safety gates.",
    "Daily Research Integrity Audit V1 emits aegis_daily_research_integrity_audit_v1 and Command Center renders a compact Daily Integrity section below Today's Research Result; this is read-only visibility and does not change trading, broker behavior, safety gates, candidate logic, paper lifecycle, exit logic, validation rules, or allocation mutation.",
    "Phase 6D Research refinement makes research-only follow-ups, latest finding, and first blocker visible above the fold; active research rows now distinguish no operator action from follow-up review without changing research logic, trading logic, execution policy, candidate generation, canonical artifacts, or safety gates.",
    "Phase 7A planning defines Performance and System Health product boundaries and implementation plans in docs/aegis_performance_screen_spec.md, docs/aegis_system_health_screen_spec.md, docs/aegis_performance_system_health_boundary.md, docs/aegis_performance_implementation_plan.md, and docs/aegis_system_health_implementation_plan.md; this is documentation only and does not change UI rendering, routes, backend logic, trading logic, sleeve logic, research logic, candidate generation, canonical artifacts, or safety gates.",
    "Phase 7B Performance implementation rebuilds /aegis-paper-performance as an operator-first read-only analytics screen with Performance Summary, Data Completeness, Contributors, Benchmark Comparison, Trends, action state, and collapsed evidence; Today, Positions, Candidates, Research, System Health, trading logic, execution logic, sleeve logic, candidate generation, canonical artifacts, and safety gates are unchanged.",
    "Phase 7D Performance refinement makes partial P&L explicit as marked-positions-only, improves benchmark/attribution wording, surfaces trend status and strategy performance limitation above the fold, and preserves boundaries with Today, Positions, Candidates, Research, System Health, trading logic, execution logic, sleeve logic, candidate generation, canonical artifacts, and safety gates unchanged.",
    "Phase 8A System Health implementation rebuilds /aegis-opportunities primary content as an operator-first System Health screen with operational status, dependency health, data availability, blockers, degraded services, repair guidance, David action state, and collapsed evidence; Today, Positions, Candidates, Research, Performance, trading logic, execution logic, sleeve logic, candidate generation, canonical artifacts, and safety gates are unchanged.",
    "Phase 8C System Health refinement adds an above-the-fold operator action summary, plain-English healthy/degraded explanation, recovery-plan-focused top issue copy, System Health route identity labels, and reduced implementation-language leakage while preserving backend behavior, canonical artifacts, and safety gates.",
    "Phase 10 Operator Shell cleanup removes backend-oriented primary navigation subtitles, moves System Health verification commands out of the primary recovery path into collapsed evidence, and clarifies Research follow-up versus active evidence-collection action language without changing trading logic, execution logic, sleeve logic, candidate generation, canonical artifacts, or safety gates.",
    "Research paper-promotion workflow UI places approval-queue recommendations above generic research follow-ups, labels David Action as paper-test approval when applicable, and exposes Approve Paper Test/Reject/Defer actions as research-only UI routing without changing hypothesis generation, shadow validation, trading logic, broker behavior, real-capital behavior, or safety gates.",
    "Research paper-promotion action wiring records append-only approval events, refreshes approval queue state, and renders success/error feedback for Approve Paper Test, Reject, and Defer; approval remains paper-research tracking only and does not change hypothesis generation, shadow validation, trading logic, broker behavior, real-capital behavior, recommendation criteria, or safety gates.",
    "Aegis Change Control System V1 is documented in docs/aegis_change_control_system_v1_requirements.md, docs/aegis_change_control_system_v1_spec.md, and docs/aegis_change_control_system_v1_design.md; it stores governed product-memory records in aegis/change_control/aegis_change_control_register_v1.json and validates that CLOSED items have required evidence without changing trading logic, broker execution, live trading, autonomous execution, sleeve logic, candidate generation, canonical trading artifacts, or safety gates.",
    "Change Control UI V1.1 and enhancement-quality records are documented in docs/aegis_change_control_ui_screen_spec.md, docs/aegis_change_control_ui_implementation_plan.md, and docs/aegis_change_control_ui_boundary.md; /aegis-change-control and /api/aegis/change-control/latest expose the governed change-control register read-only with lifecycle pipeline summary, validation dashboard, decision dashboard, closure evidence summary, and strategic enhancement seeds, with controlled approve, reject, defer, prioritize, and decision-note authority only; it has no close, validate, implement, assign, drag/drop, trading, broker, live, autonomous, sleeve, candidate generation, canonical trading artifact, or safety-gate authority.",
    "Research Validation Engine V1 is documented in docs/aegis_research_validation_engine_v1_requirements.md, docs/aegis_research_validation_engine_v1_spec.md, and docs/aegis_research_validation_engine_v1_design.md; it emits versioned hypothesis, protocol, run, result, promotion-gate, and outcome-feedback artifacts with deterministic statuses NOT_READY/UNDER_SAMPLED/INCONCLUSIVE/SUPPORTED/DISPROVEN. Only SUPPORTED can become candidate-review eligible, never tradeable; AI cannot certify validation; safety gates and candidate/sleeve/trading behavior remain unchanged.",
    "Research Validation Engine V1 rework hardens ACC-20260530-008 with protocol-specific evaluators, required metric enforcement, artifact-to-hypothesis binding checks, immutable reproducibility fields, bias-control statuses, sample-size policy checks, and research-derived candidate promotion-gate enforcement; SUPPORTED remains candidate-review-only and no trading, broker, live, autonomous, sleeve-threshold, or safety-gate behavior is enabled.",
    "Change Control V1.1 supports parent/child records, dependencies, blockers, prerequisite relationships, dependency graph reporting, completion rollups, and parent validation blocking when required children remain open; ACC-20260530-008 owns required children ACC-20260530-008A through ACC-20260530-008D.",
    "Change Control UI renders parent, child, blocker, dependency, and prerequisite record IDs as in-page links so operators can navigate the full dependency tree without searching; linked child records open immediately when selected.",
    "Command Center surfaces candidate-generation sleeve diagnostics from canonical_operator_state.opportunities.candidate_generation_visibility so operators can distinguish no setup, rejected signals, valid candidates, and blocked sleeves without changing candidate generation, trading policy, broker execution, autonomous execution, or safety gates.",
