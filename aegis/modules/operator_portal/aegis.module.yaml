    "Scheduled Run Readiness V1 emits registry, dependency manifest, readiness certificate, safe repair log, reconciliation, and self-check artifacts for known scheduled Aegis workflows; it certifies preflight readiness and predictable failures without replacing schedulers, forcing candidate generation, enabling trade advice, enabling manual capture, enabling broker execution, changing live trading policy, or weakening runtime truth.",
    "Entry Reference Price Certification Consumption Repair ensures candidate-contract builds regenerate and consume the deterministic entry-reference certification artifact before gating; uncertified entry-price rejections use canonical detail reason codes, and self-check rejects uncertified valid contracts, missing source artifact/hash, stale certified prices, unknown statuses, and missing detail codes without weakening safety gates or enabling trade advice, manual capture, broker execution, or autonomous execution.",
    "Signal evidence graph candidate construction now derives mean-reversion long-equity fields from C2_EQUITY_STRUCTURE_POLICY_V1 and vol-income short-vol fields from C2_EXPOSURE_TO_OPTIONS_INTENT_POLICY_V1 so certified raw signals can become governed paper research candidates without changing signal thresholds, certification rules, trade advice, broker execution, autonomous execution, or safety gates.",
    "Paper Auto-Promotion Mode v1 separates human approval from paper-tracking eligibility: valid certified governed candidates can enter AUTO_PROMOTED_TO_PAPER_TRACKING as paper-only research observations, while APPROVED_FOR_PAPER remains explicit human approval and trade advice, manual capture, broker execution, autonomous execution, live allocation, and safety gates remain disabled by policy.",
