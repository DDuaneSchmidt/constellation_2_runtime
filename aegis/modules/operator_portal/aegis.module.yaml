  "notes": [
    "Paper position ledger mark selection must choose the same-day market-data source with the best coverage for open paper-position symbols; partial broad/context market data must not mask fuller market_data_inputs_v1 coverage, and missing marks remain fail-closed without changing broker, trading, trade-advice, allocation, order-management, strategy, validation, or safety gates.",
